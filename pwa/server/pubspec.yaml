name: gm_server
description: GameMale PWA 後端 —— 轉發論壇、輪詢提醒、送 Web Push
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  # 跟 Flutter App 共用的論壇資料層。這 6000 多行解析累積了十幾輪
  # 踩出來的選擇器與端點知識，抽成純 Dart 套件就是為了在這裡重用，
  # 不必用別的語言重寫一遍。
  gm_api:
    path: ../../packages/gm_api
  pointycastle: ^4.0.0
  http: ^1.2.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_static: ^1.1.3

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
