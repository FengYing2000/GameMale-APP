# 跟香港 VPS 上其他站一樣的作法：不綁主機埠，加入共用的 web 網路，
# 由 Caddy 用容器名反向代理過來。
services:
  gm-push:
    build: .
    container_name: gm-push
    restart: unless-stopped
    environment:
      # 用 server/bin/vapid_keygen.dart 產一次，存進 .env 就別再換
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?先在 .env 設 VAPID_PRIVATE_KEY}
      # push service 出問題時他們會照這個聯絡你
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@xingkong.tw}
    volumes:
      - ./data:/data
    networks:
      - web

networks:
  web:
    external: true
