services:
  gm-push:
    build: .
    container_name: gm-push
    restart: unless-stopped
    environment:
      # 用 bin/vapid_keygen.dart 產一次，存進 .env 就別再換
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?先在 .env 設 VAPID_PRIVATE_KEY}
      # push service 出問題時他們會照這個聯絡你
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@xingkong.tw}
    volumes:
      - ./data:/data
    ports:
      # 只綁 127.0.0.1，對外一律走 Caddy（要 HTTPS 才有 service worker）
      - "127.0.0.1:8099:8080"
