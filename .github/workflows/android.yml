name: 建置 Android APK

on:
  push:
    branches: [main]
    # 只改 pwa/ 或文件不用重建 App。macOS 的分鐘數算 10 倍，
    # 白跑一次很貴。
    paths-ignore:
      - 'pwa/**'
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    # ubuntu 的分鐘數是 1 倍，macOS 是 10 倍，所以 APK 便宜很多
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: 安裝相依套件
        run: flutter pub get

      - name: 靜態分析
        run: flutter analyze

      - name: 測試
        # fixtures 不進版控，沒有樣本時解析測試會自己略過
        run: flutter test

      - name: 建置 APK
        # 用 debug 簽章金鑰（Flutter 會自動產），側載裝得起來；
        # 沒有正式 keystore 就不做 release 簽章，免得產出裝不了的檔案
        run: |
          flutter build apk --release
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK" || { echo "找不到 APK"; exit 1; }
          cp "$APK" GameMale.apk
          ls -lh GameMale.apk

      - name: 上傳 APK
        uses: actions/upload-artifact@v4
        with:
          name: GameMale-apk
          path: GameMale.apk
          retention-days: 30
          if-no-files-found: error
