name: 建置 iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # 一定要 macos-26（Xcode 26 + iOS 26 SDK）。macos-15 只有 Xcode 16，
    # workmanager 的 iOS 端用了 BGContinuedProcessingTask、connectivity_plus 7.x
    # 用了 NWPath.isUltraConstrained，都是 iOS 26 才有的 API；
    # #available 只是執行期檢查，編譯期沒有該 SDK 一樣過不了。
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: 安裝相依套件
        run: flutter pub get

      - name: 靜態分析
        run: flutter analyze

      - name: 測試
        # fixtures 不進版控，沒有樣本時解析測試會自己略過
        run: flutter test

      - name: 建置未簽名 IPA
        run: |
          flutter build ios --release --no-codesign
          APP="build/ios/iphoneos/Runner.app"
          test -d "$APP" || { echo "找不到 Runner.app"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          # 只清 app 層簽章；framework 層的 _CodeSignature 是預簽的正常狀態，
          # 側載工具會自己重簽，不需要動
          rm -rf Payload/Runner.app/_CodeSignature
          zip -qry GameMale.ipa Payload
          ls -lh GameMale.ipa

      - name: 上傳 IPA
        uses: actions/upload-artifact@v4
        with:
          name: GameMale-unsigned-ipa
          path: GameMale.ipa
          retention-days: 30
          if-no-files-found: error
