<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GameMale 論壇">

  <!-- 加到主畫面之後才會以獨立 App 的樣子開啟（沒有網址列、全螢幕） -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- 不是 black-translucent：那會讓內容鑽到狀態列底下 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GameMale">
  <!-- 刻意**不加** viewport-fit=cover。
       加了畫面會延伸到瀏海與圓角底下，底部導覽被切掉，而且要自己用
       env(safe-area-inset-*) 補；Flutter 網頁版又不會讀那些 CSS 變數，
       只知道視窗大小，補了反而讓「畫出來的位置」跟「摸到的位置」對不上。
       不加的話 iOS 直接把可視區收在安全範圍內，兩個問題一起消失。 -->
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0F1115">
  <!-- iOS 加到主畫面用這張（180x180 是它要的尺寸）-->
  <link rel="apple-touch-icon" href="icons/Icon-180.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- CanvasKit 沒有內建中日韓字型，遇到沒有的字會即時去 Google Fonts
       抓 Noto 的備援字型——那段空窗期就會看到「⌧」方框。先建立連線
       可以讓它早一點抓到、縮短方框出現的時間。
       要完全避免得把中文字型打包進去（好幾 MB），不划算。 -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">

  <title>GameMale</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Flutter 載入前的底色。不設的話首屏會閃一下白，
       深色主題下特別刺眼。 */
    html, body { margin:0; padding:0; height:100%; background:#0F1115; }

    /* iOS Safari 其實不理會 overscroll-behavior-x 的返回手勢，
       真正的解法是不要產生瀏覽器歷史（見 services/url_strategy_web.dart）。
       這行留著擋下拉重整之類的其他過捲行為。 */
    html, body { overscroll-behavior: none; }

    #boot { position:fixed; inset:0; display:flex; align-items:center;
      justify-content:center; flex-direction:column; gap:14px;
      color:#9099ab; background:#0F1115;
      font:14px/1.6 -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif; }
    #boot .r { width:26px; height:26px; border-radius:50%;
      border:2px solid #282d38; border-top-color:#8DB943;
      animation:sp .7s linear infinite; }
    @keyframes sp { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot"><div class="r"></div><div>載入中…</div></div>

  <script>
  // ── 「加到主畫面」的判斷 ────────────────────────────────────
  // 只有這一件事需要問瀏覽器：現在是不是還在分頁裡看。
  // 加到主畫面之後沒有網址列、全螢幕、有自己的圖示。
  window.gmInstall = {
    needed: function () {
      var standalone = window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches;
      var iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      return iOS && !standalone;
    },
  };
  </script>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const b = document.getElementById('boot');
      if (b) b.remove();

      // iOS 的主畫面 App 剛開起來時，視窗高度量到的是還沒扣掉狀態列／
      // 安全區的值。Flutter 只在啟動時量一次，所以畫面的座標會跟實際
      // 觸控的位置對不上——按鈕點不到、或點到旁邊的東西。
      // 使用者「滑一下返回就正常了」就是因為那個動作觸發了重新量測。
      // 這裡主動補幾次 resize 逼它重量。
      const nudge = function () { window.dispatchEvent(new Event('resize')); };
      nudge();
      setTimeout(nudge, 100);
      setTimeout(nudge, 400);
      setTimeout(nudge, 1000);
    });

    // 轉向、鍵盤收合、從背景切回來都會改變可視區域，一律重量一次
    window.addEventListener('orientationchange', function () {
      setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 250);
    });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') {
        setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 100);
      }
    });
  </script>
</body>
</html>
