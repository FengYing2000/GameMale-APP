<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GameMale 論壇">

  <!-- 加到主畫面之後才會以獨立 App 的樣子開啟（沒有網址列、全螢幕） -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- 不是 black-translucent：那會讓內容鑽到狀態列底下 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GameMale">
  <!-- 刻意**不加** viewport-fit=cover。
       加了畫面會延伸到瀏海與圓角底下，底部導覽被切掉，而且要自己用
       env(safe-area-inset-*) 補；Flutter 網頁版又不會讀那些 CSS 變數，
       只知道視窗大小，補了反而讓「畫出來的位置」跟「摸到的位置」對不上。
       不加的話 iOS 直接把可視區收在安全範圍內，兩個問題一起消失。 -->
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0F1115">
  <!-- iOS 加到主畫面用這張（180x180 是它要的尺寸）-->
  <link rel="apple-touch-icon" href="icons/Icon-180.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- CanvasKit 沒有內建中日韓字型，遇到沒有的字會即時去 Google Fonts
       抓 Noto 的備援字型——那段空窗期就會看到「⌧」方框。先建立連線
       可以讓它早一點抓到、縮短方框出現的時間。
       要完全避免得把中文字型打包進去（好幾 MB），不划算。 -->
  <!-- 中文字體自己出，不跟 Google 拿。
       CanvasKit 不用系統字體，遇到沒載入的字會即時去 gstatic 抓 Noto，
       抓回來之前畫面就是一整片方格打叉。preload 讓它跟 main.dart.js、
       canvaskit.wasm 平行下載，所以 Dart 端 await 時通常已經在快取裡了。
       檔名帶內容雜湊，換字體時改檔名即可。 -->
  <link rel="preload" href="fonts/gm-cjk-6683468f.ttf" as="fetch" crossorigin>

  <title>GameMale</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Flutter 載入前的底色。不設的話首屏會閃一下白，
       深色主題下特別刺眼。 */
    html, body { margin:0; padding:0; height:100%; background:#0F1115; }

    /* iOS Safari 其實不理會 overscroll-behavior-x 的返回手勢，
       真正的解法是不要產生瀏覽器歷史（見 services/url_strategy_web.dart）。
       這行留著擋下拉重整之類的其他過捲行為。 */
    html, body { overscroll-behavior: none; }

    #boot { position:fixed; inset:0; display:flex; align-items:center;
      justify-content:center; flex-direction:column; gap:14px;
      color:#9099ab; background:#0F1115;
      font:14px/1.6 -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif; }
    #boot .r { width:26px; height:26px; border-radius:50%;
      border:2px solid #282d38; border-top-color:#8DB943;
      animation:sp .7s linear infinite; }
    @keyframes sp { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot"><div class="r"></div><div>載入中…</div></div>

  <script>
  // ── 「加到主畫面」的判斷 ────────────────────────────────────
  // 只有這一件事需要問瀏覽器：現在是不是還在分頁裡看。
  // 加到主畫面之後沒有網址列、全螢幕、有自己的圖示。
  window.gmInstall = {
    // 已經以主畫面 App 開啟（控制台的裝置資料用）
    standalone: function () {
      return window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches;
    },
    needed: function () {
      var standalone = window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches;
      var iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      return iOS && !standalone;
    },
  };
  </script>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // ── 逼 Flutter 重量畫面大小 ────────────────────────────────
    // iOS 的主畫面 App 偶爾會量錯可視區高度（剛開起來、切回前景時），
    // 畫面比螢幕高、底部的頁碼列和按鈕被切到螢幕外，座標也跟觸控對不上，
    // 重開 App 才恢復。
    //
    // ⚠️ Flutter 網頁版**只聽 visualViewport 的 resize**，不聽 window 的
    // （引擎 full_page_dimensions_provider.dart）；在 iOS 上量的是
    // documentElement.clientWidth/Height。以前這裡對 window 發 resize，
    // Flutter 根本收不到，等於從沒生效過。
    var gmResizeTarget = window.visualViewport || window;
    function gmRemeasure() { gmResizeTarget.dispatchEvent(new Event('resize')); }

    // iOS 修正可視區時不一定會發 resize：每秒看一次 Flutter 量的那個值，
    // 變了就叫它重量（只是比對兩個數字，幾乎不花成本）
    (function () {
      var root = document.documentElement;
      var size = function () { return root.clientWidth + 'x' + root.clientHeight; };
      var last = size();
      setInterval(function () {
        var now = size();
        if (now !== last) { last = now; gmRemeasure(); }
      }, 1000);
    })();

    window.addEventListener('flutter-first-frame', function () {
      const b = document.getElementById('boot');
      if (b) b.remove();

      // 剛開起來量到的常是還沒扣掉狀態列／安全區的值，補幾次
      gmRemeasure();
      setTimeout(gmRemeasure, 100);
      setTimeout(gmRemeasure, 400);
      setTimeout(gmRemeasure, 1000);
      setTimeout(gmRemeasure, 2500);
    });

    // 轉向、鍵盤收合、從背景切回來都會改變可視區域，一律重量一次
    window.addEventListener('orientationchange', function () {
      setTimeout(gmRemeasure, 250);
    });
    window.addEventListener('pageshow', function () {
      setTimeout(gmRemeasure, 100);
    });
    document.addEventListener('focusout', function () {
      setTimeout(gmRemeasure, 350);
    });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') {
        setTimeout(gmRemeasure, 100);
        setTimeout(gmRemeasure, 600);
      }
    });
  </script>
</body>
</html>
