<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GameMale 論壇">

  <!-- 加到主畫面之後才會以獨立 App 的樣子開啟；iOS 也只讓主畫面 App 收推播 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GameMale">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0F1115">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GameMale</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Flutter 載入前的底色。不設的話首屏會閃一下白，
       深色主題下特別刺眼。 */
    html, body { margin:0; padding:0; height:100%; background:#0F1115; }

    /* 擋掉 Safari 自己的左右滑動返回。
       iOS 16.4 起主畫面 App 也有那個手勢，會跟 Flutter 內建的
       Cupertino 拖曳返回打架——滑一次跑兩遍動畫。擋掉之後手勢
       完全交給 Flutter，跟原生 App 一模一樣。 */
    html, body { overscroll-behavior-x: none; overscroll-behavior-y: none; }

    /* 安全區域。Flutter 網頁版不會自己讀 env(safe-area-inset-*)，
       它只知道視窗大小，所以底部導覽會被圓角和 home indicator 切掉。
       這裡把可視區域收進安全範圍內，露出來的邊框就是底色。 */
    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
    }
    #boot { position:fixed; inset:0; display:flex; align-items:center;
      justify-content:center; flex-direction:column; gap:14px;
      color:#9099ab; background:#0F1115;
      font:14px/1.6 -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif; }
    #boot .r { width:26px; height:26px; border-radius:50%;
      border:2px solid #282d38; border-top-color:#8DB943;
      animation:sp .7s linear infinite; }
    @keyframes sp { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot"><div class="r"></div><div>載入中…</div></div>

  <script>
  // ── Web Push 橋接 ──────────────────────────────────────────
  // Flutter 網頁版沒辦法用 flutter_local_notifications（那是原生外掛），
  // 推播得走瀏覽器自己的 Push API。Dart 端透過 window.gmPush.* 呼叫這裡。
  (function () {
    let registration = null;

    async function ready() {
      if (registration) return registration;
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return null;
      registration = await navigator.serviceWorker.register('push-sw.js');
      await navigator.serviceWorker.ready;
      return registration;
    }

    function toBytes(base64) {
      const padded = (base64 + '='.repeat((4 - base64.length % 4) % 4))
        .replace(/-/g, '+').replace(/_/g, '/');
      return Uint8Array.from([...atob(padded)].map((c) => c.charCodeAt(0)));
    }

    window.gmPush = {
      // 這台裝置有沒有本事收推播（iOS 一定要加到主畫面）
      supported: function () {
        const standalone = window.navigator.standalone === true ||
          window.matchMedia('(display-mode: standalone)').matches;
        const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) return 'unsupported';
        if (iOS && !standalone) return 'need-install';
        return 'ok';
      },

      status: function () {
        return ('Notification' in window) ? Notification.permission : 'unsupported';
      },

      // 回傳訂閱的 JSON 字串；失敗回傳 'error:訊息'。
      // 權限一定要在使用者手勢裡要，所以這支只能由按鈕觸發。
      enable: async function () {
        try {
          const reg = await ready();
          if (!reg) return 'error:這個瀏覽器不支援推播';
          const perm = await Notification.requestPermission();
          if (perm !== 'granted') return 'error:沒有授權通知';

          const cfg = await (await fetch('api/config', { credentials: 'same-origin' })).json();
          let sub = await reg.pushManager.getSubscription();
          if (!sub) {
            sub = await reg.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: toBytes(cfg.vapidPublicKey),
            });
          }
          return JSON.stringify(sub.toJSON());
        } catch (e) {
          return 'error:' + (e && e.message ? e.message : e);
        }
      },

      disable: async function () {
        try {
          const reg = await ready();
          const sub = reg && await reg.pushManager.getSubscription();
          if (sub) { await sub.unsubscribe(); return sub.endpoint; }
          return '';
        } catch (e) { return ''; }
      },
    };
  })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const b = document.getElementById('boot');
      if (b) b.remove();

      // iOS 的主畫面 App 剛開起來時，視窗高度量到的是還沒扣掉狀態列／
      // 安全區的值。Flutter 只在啟動時量一次，所以畫面的座標會跟實際
      // 觸控的位置對不上——按鈕點不到、或點到旁邊的東西。
      // 使用者「滑一下返回就正常了」就是因為那個動作觸發了重新量測。
      // 這裡主動補幾次 resize 逼它重量。
      const nudge = function () { window.dispatchEvent(new Event('resize')); };
      nudge();
      setTimeout(nudge, 100);
      setTimeout(nudge, 400);
      setTimeout(nudge, 1000);
    });

    // 轉向、鍵盤收合、從背景切回來都會改變可視區域，一律重量一次
    window.addEventListener('orientationchange', function () {
      setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 250);
    });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') {
        setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 100);
      }
    });
  </script>
</body>
</html>
